name: Tests and package smoke check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Unit and mocked platform tests
        run: python -m pytest -q
      - name: CLI smoke test (synthetic data only)
        run: |
          workstation-health --version
          python -m workstation_health --help
          workstation-health demo --scenario attention-needed --output smoke-results --format html,json
          python -c "import json,pathlib; p=pathlib.Path('smoke-results/synthetic-attention-needed.json'); d=json.loads(p.read_text()); assert d['scan']['synthetic']; assert d['summary']['status_counts']['CRITICAL'] >= 1"
