[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-health-report"
version = "0.1.0"
description = "Privacy-first, read-only local workstation inventory and health reporting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jordan I. Johnson" }]
dependencies = ["psutil>=5.9,<9"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
workstation-health = "workstation_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long explanatory strings/fixtures are not safely wrapped by an autoformatter.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
